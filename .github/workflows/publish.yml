name: Publish images

# Builds the three application images and pushes them to GHCR.
# Triggered by version tags (vX.Y.Z) or manually for an existing tag/ref.
# The deployment workflow consumes the tags produced here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build: tag (v1.0.0), branch, or commit SHA (short SHA accepted)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            build_args: ''
          - name: frontend
            context: ./frontend
            # Grafana is private: bake an empty URL so the UI is hidden.
            build_args: |
              VITE_API_URL=/api
              VITE_GRAFANA_URL=
          - name: nodered
            context: ./node-red
            build_args: ''
    steps:
      - name: Resolve source ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          ref="$REQUESTED_REF"
          # git can fetch only a full SHA, a branch or a tag. A short SHA fails
          # with "fatal: couldn't find remote ref", which is surfaced by
          # actions/checkout as "The process '/usr/bin/git' failed".
          # Expand commit prefixes to the full SHA first; the API resolves an
          # exact branch/tag name to its tip commit as well.
          if [[ "$ref" =~ ^[0-9a-fA-F]{4,39}$ ]]; then
            declare -a curl_opts=(--fail --show-error --silent --max-time 20 -H "Accept: application/vnd.github+json")
            if [[ -n "${GH_TOKEN:-}" ]]; then
              curl_opts+=(-H "Authorization: Bearer ${GH_TOKEN}")
            fi
            if ! resp="$(curl "${curl_opts[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${ref}")"; then
              echo "Failed to resolve '${ref}' to a commit via GitHub API" >&2
              exit 1
            fi
            full="$(jq -r '.sha // empty' <<<"$resp" 2>/dev/null)" || full=""
            if ! [[ "$full" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid commit SHA returned for '${ref}': '${full}'" >&2
              exit 1
            fi
            if [[ "${full:0:${#ref}}" != "$ref" && "$full" != "$ref" ]]; then
              echo "Resolved SHA '${full}' does not match requested prefix '${ref}'" >&2
              exit 1
            fi
            echo "Resolved commit prefix '${ref}' to '${full}'"
            ref="$full"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Lowercase owner for GHCR
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/iot-monitoring-system-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=iot-monitoring-system-${{ matrix.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: true
          sbom: true
