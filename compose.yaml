# Config convention: infra-level defaults (NODE_ENV, ports, DATABASE_URL) live
# here; secrets and app tunables are forwarded from root .env with no baked-in
# default (see .env.example) and defaulted in backend/src/config/env.ts.

# Shared healthcheck timing, merged into each service with `<<: *healthcheck`
# and overridden per service where needed.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

# Cap container log growth so a chatty service cannot fill the host disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: iot-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - iot-network
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_monitoring}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-backend
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iot_monitoring}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      RETENTION_MAX_SIZE_GB: ${RETENTION_MAX_SIZE_GB:-}
      RETENTION_CHECK_INTERVAL_MINUTES: ${RETENTION_CHECK_INTERVAL_MINUTES:-}
      RETENTION_BYTES_PER_ROW: ${RETENTION_BYTES_PER_ROW:-}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      # Path matches WORKDIR /app in backend/Dockerfile
      - ./backend/logs:/app/logs
    networks:
      - iot-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/health',
        ]

  # Node-RED Data Simulator
  nodered:
    build:
      context: ./node-red
      dockerfile: Dockerfile
    container_name: iot-nodered
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: ${TZ:-America/New_York}
      NODE_RED_ENABLE_SAFE_MODE: 'false'
      NODE_RED_ENABLE_PROJECTS: 'false'
      # Flows resolve all of these from the environment (no secrets in the
      # committed flows.json). Names must match the env field types used by
      # the postgreSQLConfig node.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-iot_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      # Editor credentials (see node-red/settings.js). Without the hash the
      # editor login cannot succeed, which fails safe.
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER:-admin}
      NODE_RED_ADMIN_PASSWORD_HASH: ${NODE_RED_ADMIN_PASSWORD_HASH:-}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:-}
      NODE_RED_DISABLE_EDITOR: ${NODE_RED_DISABLE_EDITOR:-}
    ports:
      - '${NODERED_PORT:-1880}:1880'
    volumes:
      - nodered_data:/data
    networks:
      - iot-network
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:1880/ui/',
        ]

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.2.3
    container_name: iot-grafana
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-}
      # Allow iframe embedding
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      # Serve embedded dashboards read-only to unauthenticated users so nobody
      # needs (or gets) Grafana admin access. Combined with &kiosk in the
      # iframe URLs this hides the whole top bar including the search toggle.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_NAME: 'Main Org.'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Hide the "Sign in" / login page from anonymous viewers
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      # Use SQLite for Grafana's internal database (keeps iot_monitoring clean)
      # PostgreSQL is still used as datasource for querying sensor data
      #
      # Consumed by grafana/provisioning/datasources/postgres.yaml via
      # Grafana's $VAR interpolation (no password committed to the repo).
      POSTGRES_DB: ${POSTGRES_DB:-iot_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - iot-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/api/health',
        ]

  # Adminer Database Management
  adminer:
    image: adminer:6.1.2
    container_name: iot-adminer
    restart: unless-stopped
    logging: *logging
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    networks:
      - iot-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      start_period: 10s
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:8080',
        ]

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines these at build time.
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Dev/container default points at the host-published Grafana port.
        # The production override builds this empty so the (private) Grafana
        # UI is hidden instead of showing a dead iframe.
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://localhost:3001}
    container_name: iot-frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    networks:
      - iot-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      start_period: 10s
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:80',
        ]

networks:
  iot-network:
    driver: bridge
    name: iot-network

volumes:
  postgres_data:
    name: iot-postgres-data
  nodered_data:
    name: iot-nodered-data
  grafana_data:
    name: iot-grafana-data
